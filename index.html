<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Meteo Pro Dashboard</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        /* Variabili CSS */
        :root {
            --card-bg: rgba(30, 41, 59, 0.85); 
            --text-main: #f8fafc;
            --text-muted: #cbd5e1;
            --accent: #38bdf8;
            --accent-hover: #0ea5e9;
            --border: rgba(255, 255, 255, 0.1);
        }

        body {
            font-family: 'Inter', sans-serif;
            color: var(--text-main);
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background-color: #0f172a; 
            background-image: radial-gradient(circle at top right, #1e293b, #0f172a);
            transition: background-image 1s ease-in-out; 
        }

        .dashboard {
            width: 100%;
            max-width: 800px;
            background: var(--card-bg);
            border-radius: 24px;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.7);
            padding: 2.5rem;
            border: 1px solid var(--border);
            margin: 20px;
            backdrop-filter: blur(12px); 
        }

        /* --- HEADER & SEARCH --- */
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 2rem;
            flex-wrap: wrap;
            gap: 1rem;
        }
        .header h1 {
            margin: 0;
            font-size: 1.5rem;
            font-weight: 600;
            letter-spacing: -0.5px;
            text-shadow: 0 2px 4px rgba(0,0,0,0.5);
        }
        .search-container {
            display: flex;
            position: relative;
            width: 300px;
        }
        .search-container input {
            width: 100%;
            padding: 12px 20px;
            border-radius: 30px;
            border: 1px solid var(--border);
            background: rgba(0, 0, 0, 0.3);
            color: var(--text-main);
            font-size: 0.95rem;
            outline: none;
            transition: all 0.3s;
        }
        .search-container input:focus {
            border-color: var(--accent);
            background: rgba(0, 0, 0, 0.5);
        }
        .search-container button {
            position: absolute;
            right: 5px;
            top: 5px;
            bottom: 5px;
            border: none;
            border-radius: 25px;
            background: var(--accent);
            color: #0f172a;
            font-weight: 600;
            padding: 0 20px;
            cursor: pointer;
            transition: background 0.2s;
        }
        .search-container button:hover {
            background: var(--accent-hover);
        }

        /* --- SCHERMATA INIZIALE (Benvenuto) --- */
        .welcome-container {
            text-align: center;
            padding: 2rem 1rem 3rem 1rem;
            color: var(--text-muted);
        }
        .welcome-icon {
            font-size: 5rem;
            margin-bottom: 1rem;
            display: inline-block;
            /* Animazione CSS per far fluttuare l'icona */
            animation: float 3s ease-in-out infinite;
        }
        @keyframes float {
            0% { transform: translateY(0px); }
            50% { transform: translateY(-15px); }
            100% { transform: translateY(0px); }
        }
        .welcome-container h2 {
            color: var(--text-main);
            font-size: 2rem;
            margin-bottom: 0.5rem;
            margin-top: 0;
            font-weight: 600;
            border: none;
        }
        .quick-cities {
            margin-top: 2rem;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 10px;
            flex-wrap: wrap;
        }
        .quick-btn {
            background: rgba(255,255,255,0.05);
            border: 1px solid var(--border);
            color: var(--text-main);
            padding: 8px 16px;
            border-radius: 20px;
            cursor: pointer;
            transition: all 0.3s;
            font-size: 0.9rem;
        }
        .quick-btn:hover {
            background: var(--accent);
            color: #0f172a;
            border-color: var(--accent);
            transform: translateY(-2px);
        }

        /* --- MAIN WEATHER DISPLAY --- */
        .weather-main {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding-bottom: 2rem;
            border-bottom: 1px solid var(--border);
            margin-bottom: 2rem;
            display: none;
        }
        .current-temp-box {
            display: flex;
            align-items: center;
            gap: 20px;
        }
        .weather-icon {
            font-size: 5rem;
            line-height: 1;
            filter: drop-shadow(0 4px 6px rgba(0,0,0,0.3));
        }
        .temp-huge {
            font-size: 4.5rem;
            font-weight: 700;
            margin: 0;
            letter-spacing: -2px;
            text-shadow: 0 2px 10px rgba(0,0,0,0.3);
        }
        .city-title {
            font-size: 2.2rem;
            margin: 0 0 5px 0;
            font-weight: 600;
            text-shadow: 0 2px 4px rgba(0,0,0,0.5);
        }
        .weather-desc {
            color: var(--accent);
            font-size: 1.1rem;
            font-weight: 500;
            margin: 0;
        }

        /* --- WEATHER DETAILS GRID --- */
        .details-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
            gap: 1.5rem;
            display: none;
        }
        .detail-card {
            background: rgba(0, 0, 0, 0.3);
            padding: 1.5rem;
            border-radius: 16px;
            border: 1px solid var(--border);
            text-align: center;
        }
        .detail-title {
            color: var(--text-muted);
            font-size: 0.85rem;
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-bottom: 10px;
        }
        .detail-value {
            font-size: 1.5rem;
            font-weight: 600;
            margin: 0;
        }

        /* --- FORECAST --- */
        .forecast-container {
            margin-top: 2rem;
            display: none;
        }
        .forecast-title {
            font-size: 1.1rem;
            color: var(--text-muted);
            margin-bottom: 1rem;
        }
        .forecast-list {
            display: flex;
            justify-content: space-between;
            gap: 10px;
            overflow-x: auto;
            padding-bottom: 10px;
        }
        .forecast-item {
            background: rgba(0, 0, 0, 0.3);
            padding: 1rem;
            border-radius: 12px;
            text-align: center;
            min-width: 80px;
            border: 1px solid transparent;
            transition: border-color 0.3s;
        }
        .forecast-item:hover { border-color: var(--accent); }
        .forecast-day { font-size: 0.9rem; font-weight: 600; margin-bottom: 5px; }
        .forecast-icon { font-size: 1.5rem; margin: 10px 0; }
        .forecast-temp { font-size: 1rem; font-weight: 600; }
        .forecast-temp-min { font-size: 0.8rem; color: var(--text-muted); }

        /* --- STATUS MESSAGES --- */
        .status-message {
            text-align: center;
            padding: 3rem;
            color: var(--text-muted);
            font-size: 1.1rem;
            display: none; /* Nascosto all'inizio */
        }
        .error { color: #ef4444; }

        @media (max-width: 600px) {
            .header { flex-direction: column; align-items: flex-start; }
            .search-container { width: 100%; }
            .weather-main { flex-direction: column; text-align: center; gap: 20px; }
            .current-temp-box { flex-direction: column; gap: 0; }
        }
    </style>
</head>
<body>

    <div class="dashboard">
        <div class="header">
            <h1>MeteoPro</h1>
            <div class="search-container">
                <input type="text" id="city-input" placeholder="Cerca città (es. Roma)..." onkeypress="handleEnter(event)">
                <button onclick="fetchWeatherData()">Cerca</button>
            </div>
        </div>

        <!-- SCHERMATA DI BENVENUTO INIZIALE -->
        <div id="welcome-state" class="welcome-container">
            <div class="welcome-icon">🌤️</div>
            <h2>Benvenuto in MeteoPro</h2>
            <p>Cerca una città nella barra in alto per visualizzare le previsioni dettagliate in tempo reale.</p>
            
            <div class="quick-cities">
                <span style="margin-right: 10px;">Città popolari:</span>
                <button class="quick-btn" onclick="quickSearch('Roma')">Roma</button>
                <button class="quick-btn" onclick="quickSearch('Milano')">Milano</button>
                <button class="quick-btn" onclick="quickSearch('Napoli')">Napoli</button>
                <button class="quick-btn" onclick="quickSearch('New York')">New York</button>
                <button class="quick-btn" onclick="quickSearch('Tokyo')">Tokyo</button>
            </div>
        </div>

        <!-- MESSAGGI DI CARICAMENTO O ERRORE -->
        <div id="status-container" class="status-message"></div>

        <!-- DATI METEO REALI -->
        <div class="weather-main" id="weather-main">
            <div>
                <h2 class="city-title" id="display-city">--</h2>
                <p class="weather-desc" id="weather-desc">--</p>
                <p style="color: var(--text-muted); margin: 5px 0 0 0; font-size: 0.9rem;" id="date-display">--</p>
            </div>
            <div class="current-temp-box">
                <div class="weather-icon" id="main-icon">☀️</div>
                <div class="temp-huge"><span id="temp-value">--</span>°</div>
            </div>
        </div>

        <div class="details-grid" id="details-grid">
            <div class="detail-card">
                <div class="detail-title">Percepita</div>
                <div class="detail-value"><span id="feels-like">--</span>°C</div>
            </div>
            <div class="detail-card">
                <div class="detail-title">Vento</div>
                <div class="detail-value"><span id="wind-speed">--</span> km/h</div>
            </div>
            <div class="detail-card">
                <div class="detail-title">Umidità</div>
                <div class="detail-value"><span id="humidity">--</span>%</div>
            </div>
            <div class="detail-card">
                <div class="detail-title">Min / Max</div>
                <div class="detail-value"><span id="temp-min">--</span>° / <span id="temp-max">--</span>°</div>
            </div>
        </div>

        <div class="forecast-container" id="forecast-container">
            <div class="forecast-title">Previsioni Settimanali</div>
            <div class="forecast-list" id="forecast-list"></div>
        </div>
    </div>

    <script>
        const weatherCodes = {
            0:  { desc: "Cielo sereno", icon: "☀️" },
            1:  { desc: "Prevalentemente sereno", icon: "🌤️" },
            2:  { desc: "Parzialmente nuvoloso", icon: "⛅" },
            3:  { desc: "Nuvoloso", icon: "☁️" },
            45: { desc: "Nebbia", icon: "🌫️" },
            48: { desc: "Nebbia con brina", icon: "🌫️" },
            51: { desc: "Pioviggine leggera", icon: "🌦️" },
            53: { desc: "Pioviggine moderata", icon: "🌦️" },
            55: { desc: "Pioviggine densa", icon: "🌧️" },
            61: { desc: "Pioggia debole", icon: "🌧️" },
            63: { desc: "Pioggia moderata", icon: "🌧️" },
            65: { desc: "Pioggia forte", icon: "⛈️" },
            71: { desc: "Neve debole", icon: "🌨️" },
            73: { desc: "Neve moderata", icon: "🌨️" },
            75: { desc: "Neve forte", icon: "❄️" },
            95: { desc: "Temporale", icon: "🌩️" },
            99: { desc: "Temporale forte", icon: "⛈️" }
        };

        function getWeatherInfo(code) { return weatherCodes[code] || { desc: "Variabile", icon: "🌥️" }; }
        function handleEnter(event) { if (event.key === 'Enter') fetchWeatherData(); }
        
        function formatDate(dateString) {
            const date = new Date(dateString);
            return date.toLocaleDateString('it-IT', { weekday: 'long', day: 'numeric', month: 'long' }).replace(/^\w/, c => c.toUpperCase());
        }

        function getShortDay(dateString) {
            const date = new Date(dateString);
            return date.toLocaleDateString('it-IT', { weekday: 'short' }).replace(/^\w/, c => c.toUpperCase());
        }

        // Funzione per i pulsanti di ricerca rapida
        function quickSearch(city) {
            document.getElementById('city-input').value = city;
            fetchWeatherData();
        }

        async function fetchWeatherData() {
            const cityInput = document.getElementById('city-input').value.trim();
            if (!cityInput) return;

            const welcomeState = document.getElementById('welcome-state');
            const statusContainer = document.getElementById('status-container');
            const weatherMain = document.getElementById('weather-main');
            const detailsGrid = document.getElementById('details-grid');
            const forecastContainer = document.getElementById('forecast-container');

            // Nascondiamo il benvenuto e i vecchi dati
            welcomeState.style.display = 'none';
            weatherMain.style.display = 'none';
            detailsGrid.style.display = 'none';
            forecastContainer.style.display = 'none';
            
            // Mostriamo il caricamento
            statusContainer.style.display = 'block';
            statusContainer.innerHTML = 'Ricerca in corso...';
            statusContainer.className = 'status-message';

            try {
                const geoUrl = `https://geocoding-api.open-meteo.com/v1/search?name=${encodeURIComponent(cityInput)}&count=1&language=it&format=json`;
                const geoRes = await fetch(geoUrl);
                const geoData = await geoRes.json();

                if (!geoData.results || geoData.results.length === 0) {
                    throw new Error("Città non trovata. Controlla l'ortografia.");
                }

                const city = geoData.results[0];
                
                const weatherUrl = `https://api.open-meteo.com/v1/forecast?latitude=${city.latitude}&longitude=${city.longitude}&current_weather=true&hourly=relativehumidity_2m,apparent_temperature&daily=weathercode,temperature_2m_max,temperature_2m_min&timezone=auto`;
                const weatherRes = await fetch(weatherUrl);
                const weatherData = await weatherRes.json();

                updateUI(city.name, weatherData);

            } catch (error) {
                statusContainer.innerHTML = error.message;
                statusContainer.className = 'status-message error';
            }
        }

        function updateUI(cityName, data) {
            const current = data.current_weather;
            const daily = data.daily;
            const hourly = data.hourly;
            
            const currentTimeStr = current.time.substring(0, 14) + "00"; 
            const hourIndex = hourly.time.findIndex(t => t === currentTimeStr) || 0;
            const weatherInfo = getWeatherInfo(current.weathercode);

            // Sfondo dinamico
            document.body.style.backgroundImage = `linear-gradient(rgba(15, 23, 42, 0.75), rgba(15, 23, 42, 0.9)), url('https://loremflickr.com/1920/1080/${encodeURIComponent(cityName)},city/all')`;
            document.body.style.backgroundSize = 'cover';
            document.body.style.backgroundPosition = 'center';
            document.body.style.backgroundAttachment = 'fixed';

            document.getElementById('display-city').textContent = cityName;
            document.getElementById('temp-value').textContent = Math.round(current.temperature);
            document.getElementById('weather-desc').textContent = weatherInfo.desc;
            document.getElementById('main-icon').textContent = weatherInfo.icon;
            document.getElementById('date-display').textContent = formatDate(new Date());

            document.getElementById('wind-speed').textContent = current.windspeed;
            document.getElementById('feels-like').textContent = Math.round(hourly.apparent_temperature[hourIndex]);
            document.getElementById('humidity').textContent = hourly.relativehumidity_2m[hourIndex];
            document.getElementById('temp-max').textContent = Math.round(daily.temperature_2m_max[0]);
            document.getElementById('temp-min').textContent = Math.round(daily.temperature_2m_min[0]);

            const forecastList = document.getElementById('forecast-list');
            forecastList.innerHTML = ''; 
            
            for (let i = 1; i < 7; i++) {
                const dayInfo = getWeatherInfo(daily.weathercode[i]);
                const dayHTML = `
                    <div class="forecast-item">
                        <div class="forecast-day">${getShortDay(daily.time[i])}</div>
                        <div class="forecast-icon">${dayInfo.icon}</div>
                        <div class="forecast-temp">${Math.round(daily.temperature_2m_max[i])}°</div>
                        <div class="forecast-temp-min">${Math.round(daily.temperature_2m_min[i])}°</div>
                    </div>
                `;
                forecastList.insertAdjacentHTML('beforeend', dayHTML);
            }

            document.getElementById('status-container').style.display = 'none';
            document.getElementById('weather-main').style.display = 'flex';
            document.getElementById('details-grid').style.display = 'grid';
            document.getElementById('forecast-container').style.display = 'block';
        }
    </script>
</body>
</html>
